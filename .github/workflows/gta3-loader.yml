name: GTA III Loader APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'gta3-loader/**'
      - '.github/workflows/gta3-loader.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: gradle -p gta3-loader assembleDebug --no-daemon
      - run: cp gta3-loader/app/build/outputs/apk/debug/app-debug.apk GTA3Loader.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GTA3Loader
          path: GTA3Loader.apk
