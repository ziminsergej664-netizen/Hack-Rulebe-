name: Hack Rulebe Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK"
          MANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$MANAGER" ]; then
            curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-tools.zip
            unzip -q /tmp/android-tools.zip -d /tmp/rulebe-sdk
            mkdir -p "$SDK/cmdline-tools"
            mv /tmp/rulebe-sdk/cmdline-tools "$SDK/cmdline-tools/latest"
            MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          dirname "$MANAGER" >> "$GITHUB_PATH"
          "$MANAGER" --version
          set +o pipefail
          yes | "$MANAGER" --sdk_root="$SDK" --licenses
          set -o pipefail
      - name: Fetch engine and dependencies
        run: |
          git clone https://github.com/codepdbh/re3-android-port-evolved.git engine
          git -C engine checkout 0219ec7dfc9a823afeab8a7cca6a7e1c6899e8cd
          git -C engine submodule update --init --recursive
      - name: Install Android toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Apply Rulebe modifications
        run: python3 apply_rulebe.py engine
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure Maven Central mirror
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path("engine/android/launcher").rglob("*"):
              if p.is_file() and p.name.endswith((".gradle", ".gradle.kts")):
                  s=p.read_text()
                  t=s.replace("mavenCentral()", 'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2") }')
                  t=t.replace("https://repo.maven.apache.org/maven2", "https://maven-central.storage-download.googleapis.com/maven2")
                  if s!=t:
                      p.write_text(t)
                      print("Updated",p)
          PY
      - name: Build APK
        working-directory: engine/android/launcher
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            set +e
            ./gradlew assembleStandardDebug --stacktrace --max-workers=2 --no-parallel 2>&1 | tee /tmp/rulebe-build.log
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then exit 0; fi
            if ! grep -qiE '429|Too Many Requests' /tmp/rulebe-build.log; then exit "$status"; fi
            if [ "$attempt" -eq 3 ]; then exit "$status"; fi
            sleep $((attempt * 120))
          done
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hack-Rulebe-APK
          path: engine/android/launcher/app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
